        </div>
        <div style="display: flex; align-items: flex-end; gap: 10px; height: 106px;">
          <sc-for list="{{semanas}}" as="semana" hint-placeholder-count="6">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; flex-grow: 1; height: 100%;">

        </svg>

          <span style="font-size: 17px;">🙂</span>

          <span style="font-size: 17px;">🙂</span>
          <span style="font-size: 17px;">😄</span>

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(60,60,67,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 10.6 12 3.6l8.6 7"></path><path d="M5.6 9.4V20a1 1 0 0 0 1 1h10.8a1 1 0 0 0 1-1V9.4"></path></svg>

    <span style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%;">

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var datos = [
      { etiqueta: 'S1', valor: 71 },
      { etiqueta: 'S2', valor: 86 },
      { etiqueta: 'S3', valor: 100 },
      { etiqueta: 'S4', valor: 57 },
      { etiqueta: 'S5', valor: 100 },
      { etiqueta: 'S6', valor: 95 }
    ];
    var semanas = datos.map(function (d) {
      var alto = Math.round(d.valor * 0.66);
      var color = d.valor === 100 ? '#34C759' : '#007AFF';
      return {
        etiqueta: d.etiqueta,
        valor: d.valor + '%',
        barra: 'height: ' + alto + 'px; background: ' + color + ';'
      };
    });
    return { semanas: semanas };
  }
}
</script>
