<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B4DFF; } a:hover { color: #123AC7; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F8FC; position: relative; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 60px 20px 0;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 15px; background: #FFFFFF; border: 1px solid #EAEEF6;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14161C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m11 6-6 6 6 6"></path></svg>
      </span>
      <h1 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: #14161C;">Sin alcohol</h1>
      <span style="display: flex; align-items: center; justify-content: center; gap: 3px; width: 44px; height: 44px; border-radius: 15px; background: #FFFFFF; border: 1px solid #EAEEF6;">
        <span style="width: 3.5px; height: 3.5px; border-radius: 50%; background: #14161C;"></span>
        <span style="width: 3.5px; height: 3.5px; border-radius: 50%; background: #14161C;"></span>
        <span style="width: 3.5px; height: 3.5px; border-radius: 50%; background: #14161C;"></span>
      </span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 20px 20px; border-radius: 24px; background: #FFFFFF; border: 1px solid #EAEEF6;">
      <span style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 16px; background: rgba(255,107,44,0.12);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#FF6B2C"><path d="M12.7 2.2c.4 2.5-.6 3.8-1.7 5-1.2 1.3-2.5 2.6-2.5 5.1a3.5 3.5 0 0 0 7 0c0-1.3-.5-2.2-1-3 1.6.9 3 2.9 3 5.3a5.5 5.5 0 0 1-11 0c0-4.3 2.6-5.9 4-8.2.9-1.4 1.3-2.7 1.2-4.2z"></path></svg>
      </span>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <b style="font-family: 'Sora', system-ui, sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: #14161C; font-variant-numeric: tabular-nums;">7</b>
        <span style="font-size: 15px; font-weight: 600; color: #5A6376;">días de racha</span>
      </div>
      <span style="font-size: 13px; font-weight: 500; color: #7A8296;">Próximo hito: 14 días</span>
      <div style="display: flex; gap: 7px; width: 100%; margin-top: 4px;">
        <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; border-radius: 11px; background: #FF6B2C;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; border-radius: 11px; background: #FF6B2C;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; border-radius: 11px; background: #FF6B2C;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; border-radius: 11px; background: #FF6B2C;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; border-radius: 11px; background: #FF6B2C;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; border-radius: 11px; background: #FF6B2C;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 34px; border-radius: 11px; background: #FFFFFF; border: 2px dashed #C3CCDC; font-size: 11px; font-weight: 700; color: #7A8296;">HOY</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 13px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EAEEF6;">
        <b style="font-family: 'Sora', system-ui, sans-serif; font-size: 19px; font-weight: 700; color: #14161C; font-variant-numeric: tabular-nums;">18</b>
        <small style="font-size: 10.5px; font-weight: 600; color: #7A8296; text-align: center;">Días limpios</small>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 13px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EAEEF6;">
        <b style="font-family: 'Sora', system-ui, sans-serif; font-size: 19px; font-weight: 700; color: #14161C; font-variant-numeric: tabular-nums;">11</b>
        <small style="font-size: 10.5px; font-weight: 600; color: #7A8296; text-align: center;">Mejor racha</small>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 13px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EAEEF6;">
        <b style="font-family: 'Sora', system-ui, sans-serif; font-size: 19px; font-weight: 700; color: #14161C; font-variant-numeric: tabular-nums;">95%</b>
        <small style="font-size: 10.5px; font-weight: 600; color: #7A8296; text-align: center;">Cumplimiento</small>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 13px 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EAEEF6;">
        <b style="font-family: 'Sora', system-ui, sans-serif; font-size: 19px; font-weight: 700; color: #C2410C; font-variant-numeric: tabular-nums;">1</b>
        <small style="font-size: 10.5px; font-weight: 600; color: #7A8296; text-align: center;">Recaída</small>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 14px; border-radius: 22px; background: #FFFFFF; border: 1px solid #EAEEF6;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #14161C;">Agosto</h2>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: #7A8296;">
            <span style="width: 9px; height: 9px; border-radius: 3px; background: #1B4DFF;"></span>Limpio
          </span>
          <span style="display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: #7A8296;">
            <span style="width: 9px; height: 9px; border-radius: 3px; background: #F2B441;"></span>Recaída
          </span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;">
        <span style="text-align: center; font-size: 10px; font-weight: 700; color: #9AA2B4;">L</span>
        <span style="text-align: center; font-size: 10px; font-weight: 700; color: #9AA2B4;">M</span>
        <span style="text-align: center; font-size: 10px; font-weight: 700; color: #9AA2B4;">M</span>
        <span style="text-align: center; font-size: 10px; font-weight: 700; color: #9AA2B4;">J</span>
        <span style="text-align: center; font-size: 10px; font-weight: 700; color: #9AA2B4;">V</span>
        <span style="text-align: center; font-size: 10px; font-weight: 700; color: #9AA2B4;">S</span>
        <span style="text-align: center; font-size: 10px; font-weight: 700; color: #9AA2B4;">D</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;">
        <sc-for list="{{celdas}}" as="celda" hint-placeholder-count="36">
          <span style="display: flex; align-items: center; justify-content: center; height: 30px; border-radius: 9px; font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; {{celda.estilo}}">{{celda.dia}}</span>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; align-items: center; gap: 10px;">
    <span style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 56px; border-radius: 18px; background: #14161C; color: #FFFFFF; font-size: 15px; font-weight: 700; flex-grow: 1;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
      Marcar hoy
    </span>
    <span style="display: flex; align-items: center; justify-content: center; height: 56px; padding: 0 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E8F1; color: #5A6376; font-size: 14px; font-weight: 600;">Recaí</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var celdas = [];
    var i;
    for (i = 0; i < 5; i++) {
      celdas.push({ dia: '', estilo: 'background: transparent;' });
    }
    for (i = 1; i <= 31; i++) {
      var estilo;
      if (i === 12) {
        estilo = 'background: #F2B441; color: #4A3208;';
      } else if (i <= 19) {
        estilo = 'background: #1B4DFF; color: #FFFFFF;';
      } else if (i === 20) {
        estilo = 'background: #FFFFFF; border: 2px solid #1B4DFF; color: #1B4DFF;';
      } else {
        estilo = 'background: #EDF0F6; color: #AEB6C6;';
      }
      celdas.push({ dia: String(i), estilo: estilo });
    }
    return { celdas: celdas };
  }
}
</script>
</body>
</html>
