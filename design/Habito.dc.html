<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var celdas = [];
    var i;
    for (i = 0; i < 5; i++) {
      celdas.push({ dia: '', estilo: 'background: transparent;' });
    }
    for (i = 1; i <= 31; i++) {
      var estilo;
      if (i === 12) {
        estilo = 'background: #FFCC00; color: #4A3A00;';
      } else if (i <= 19) {
        estilo = 'background: #007AFF; color: #FFFFFF;';
      } else if (i === 20) {
        estilo = 'background: #FFFFFF; box-shadow: inset 0 0 0 2px #007AFF; color: #007AFF;';
      } else {
        estilo = 'background: rgba(120,120,128,0.12); color: rgba(60,60,67,0.3);';
      }
      celdas.push({ dia: String(i), estilo: estilo });
    }
    return { celdas: celdas };
  }
}
</script>
